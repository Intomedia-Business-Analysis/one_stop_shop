<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kunde — Intomedia Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/hub.css">
  <link rel="icon" type="image/svg+xml" href="/static/icons/pulse.svg">
  <style>
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow-card); margin-bottom:24px; overflow:hidden; }
    .panel-header { padding:15px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-end; gap:16px; }
    .panel-header h2 { font-size:13px; font-weight:700; color:var(--ink); margin:0; }
    .panel-header p  { font-size:11px; color:var(--ink-3); margin:3px 0 0; }
    .panel-body { padding:20px; }

    /* Topkort: kundens samlede billede. Antal abonnementer står ved siden af
       ARR, fordi det er dem samtalen skal dække — ét opkald, flere udfald. */
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:24px; }
    .kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow-card); padding:14px 16px; }
    .kpi .k-label { font-size:11px; font-weight:600; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; }
    .kpi .k-value { font-size:22px; font-weight:700; color:var(--ink); margin:6px 0 2px; }
    .kpi .k-note  { font-size:11px; color:var(--ink-4); line-height:1.5; }

    /* Ét kort pr. abonnement. Farven følger VÆGTEN som på §7.2, ikke zonens
       navn — tre zoner deler gul, fordi de har samme prioritet. */
    .abo { border:1px solid var(--border); border-left:4px solid var(--ink-4); border-radius:var(--r);
           padding:14px 16px; margin-bottom:12px; background:var(--surface); }
    .abo.stoppet       { border-left-color:var(--danger); }
    .abo.laenge_tavs   { border-left-color:var(--warn); }
    .abo.aldrig_i_brug { border-left-color:var(--warn); }
    .abo.faldende      { border-left-color:var(--warn); }
    .abo.sund          { border-left-color:var(--win); }
    .abo.ny            { border-left-color:var(--taupe); }
    .abo.intet_signal  { border-left-color:var(--ink-4); }
    .abo-top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
    .abo-site { font-size:14px; font-weight:700; color:var(--ink); }
    .abo-sub  { font-size:11px; color:var(--ink-3); margin-top:3px; line-height:1.6; }
    .abo-arr  { font-size:16px; font-weight:700; color:var(--ink); white-space:nowrap; }
    .zpill { display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
             padding:2px 8px; border-radius:999px; background:var(--bg-2,#f0efec); color:var(--ink-2); }

    /* Sparkline. Ingen akser: den skal læses som en form, ikke aflæses. Den
       præcise værdi står i title på hver søjle. */
    .spark { display:flex; align-items:flex-end; gap:2px; height:38px; margin-top:10px; }
    .spark i { flex:1; background:var(--ink-4); border-radius:1px 1px 0 0; min-height:1px; display:block; }
    .spark i.ref { background:var(--ink-2); }
    .spark-x { display:flex; justify-content:space-between; font-size:10px; color:var(--ink-4); margin-top:3px; }

    .hist { border-left:2px solid var(--border); padding-left:16px; margin-left:4px; }
    .hist-item { margin-bottom:16px; }
    .hist-head { font-size:12px; font-weight:600; color:var(--ink); }
    .hist-meta { font-size:11px; color:var(--ink-3); margin-top:2px; }
    .hist-udfald { font-size:11px; color:var(--ink-2); margin-top:6px; line-height:1.7; }

    .fine  { font-size:11px; color:var(--ink-4); line-height:1.6; }
    .tom   { font-size:12px; color:var(--ink-3); padding:8px 0; }
    .advar { background:#fdf6e3; border:1px solid var(--warn); border-radius:var(--r); padding:10px 14px;
             font-size:11px; color:var(--ink-2); margin-bottom:16px; line-height:1.6; }
  </style>
</head>
<body>
<div class="shell">

  {% with active_url='/retention/risk_overview' %}{% include "_sidebar.html" %}{% endwith %}

  <div class="main">
    <div class="topbar">
      <div class="search-trigger" role="button" tabindex="0">
        <div class="st-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
        </div>
        <span class="st-text">Søg i dashboards, tools og kategorier…</span>
        <div class="st-right"><span class="st-k">⌘</span><span class="st-k">K</span></div>
      </div>
    </div>

    <div style="flex:1;min-height:0;overflow-y:auto;">
      <div style="padding:2rem;max-width:1400px;">

        <div class="breadcrumb">
          <a href="/" class="bc-link">Hub</a>
          <span class="bc-sep">/</span>
          <a href="/retention/overview" class="bc-link">Retention</a>
          <span class="bc-sep">/</span>
          <a href="/retention/risk_overview" class="bc-link">Churn-risiko</a>
          <span class="bc-sep">/</span>
          <span class="bc-current" id="bc-kunde">Kunde</span>
        </div>

        <div class="summary-bar">
          <div>
            <h1 id="titel">Indlæser…</h1>
            <p id="undertitel"></p>
          </div>
        </div>

        <div id="advarsler"></div>
        <div class="kpis" id="kpis"></div>

        <div class="panel">
          <div class="panel-header">
            <div>
              <h2>Abonnementer</h2>
              <p id="abo-sub">Indlæser…</p>
            </div>
          </div>
          <div class="panel-body" id="abonnementer"></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div>
              <h2>Tidligere samtaler</h2>
              <p id="hist-sub"></p>
            </div>
          </div>
          <div class="panel-body" id="historik"></div>
        </div>

      </div>
    </div>
  </div>
</div>
<script>
(async function () {
  const ACCOUNT = {{ account | tojson }};
  const ORG_ID  = {{ org_id | tojson }};

  const nf0 = new Intl.NumberFormat('da-DK', { maximumFractionDigits: 0 });
  const nfv = new Intl.NumberFormat('da-DK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const kr = v => v === null || v === undefined ? '—' : nf0.format(v) + ' kr.';
  const dato = s => !s ? '—' : String(s).slice(0, 10);

  const ZONE_TEKST = {
    stoppet:       'Læste før, læser ikke længere',
    laenge_tavs:   'Ingen aktivitet i lang tid',
    aldrig_i_brug: 'Har aldrig taget produktet i brug',
    faldende:      'Forbruget falder',
    sund:          'Stabilt forbrug',
    ny:            'For ny til at vurderes',
    intet_signal:  'Vi kan ikke se forbruget — ikke det samme som risiko'
  };

  let d;
  try {
    const res = await fetch(`/retention/kunde_data/${encodeURIComponent(ACCOUNT)}/${encodeURIComponent(ORG_ID)}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    d = await res.json();
  } catch (e) {
    document.getElementById('titel').textContent = 'Kunne ikke hente kunden';
    document.getElementById('undertitel').textContent = String(e);
    return;
  }

  const k = d.kunde;
  const navn = k.org_name || `${ACCOUNT} / ${ORG_ID}`;
  document.title = navn + ' — Intomedia Hub';
  document.getElementById('bc-kunde').textContent = navn;
  document.getElementById('titel').textContent = navn;
  document.getElementById('undertitel').textContent =
    [k.owner_name ? 'Ejer: ' + k.owner_name : 'Ingen ejer i ACV',
     k.teams || 'Intet team'].join(' · ');

  // Forbehold øverst, ikke nederst: de ændrer hvordan tallene skal læses.
  const adv = [];
  if (d.ingen_aktive) adv.push('Kunden har ingen aktive abonnementer i ' +
    esc(d.meta.abo_maaned) + '. Historikken vises alligevel.');
  if (k.mikrokunde) adv.push('Mikrokunde (under 5.000 kr./år). PRD §10 regel 2: ' +
    'får aldrig et opkald — den automatiserede mail er sporet her.');
  if (d.meta.usage_error) adv.push('Forbrugsdata kunne ikke læses: ' +
    esc(d.meta.usage_error) + '. Zoner og grafer er derfor ikke retvisende.');
  if (d.meta.reference_alder > 0) adv.push('Forbrugssignalet er ' +
    d.meta.reference_alder + ' måned(er) gammelt (reference ' +
    esc(d.meta.reference_maaned) + '). Eksporten er ikke kørt.');
  if (!d.meta.thresholds_validated) adv.push('Zonetærsklerne er ikke kalibreret ' +
    'på rigtige udfald endnu (PRD §9). Zonen er et kvalificeret gæt, ikke en måling.');
  document.getElementById('advarsler').innerHTML =
    adv.map(t => `<div class="advar">${t}</div>`).join('');

  document.getElementById('kpis').innerHTML = `
    <div class="kpi">
      <div class="k-label">Årsværdi</div>
      <div class="k-value">${kr(k.arr_dkk)}</div>
      <div class="k-note">Kundens samlede ARR fra ACV</div>
    </div>
    <div class="kpi">
      <div class="k-label">Abonnementer</div>
      <div class="k-value">${k.antal_abonnementer}</div>
      <div class="k-note">aktive i ${esc(d.meta.abo_maaned)}</div>
    </div>
    <div class="kpi">
      <div class="k-label">Samtaler registreret</div>
      <div class="k-value">${d.historik.length}</div>
      <div class="k-note">${d.historik.length ? 'seneste ' + dato(d.historik[0].contacted_at) : 'ingen endnu'}</div>
    </div>`;

  // --- abonnementer ---
  const abos = d.abonnementer;
  document.getElementById('abo-sub') .textContent = abos.length
    ? `${abos.length} abonnement(er), højeste score først`
    : 'Ingen aktive abonnementer';

  const sparkline = (trend, ref) => {
    if (!trend || !trend.length) return '';
    const max = Math.max(...trend.map(t => t.sidevisninger), 1);
    const bars = trend.map(t => {
      const h = Math.round((t.sidevisninger / max) * 100);
      const erRef = t.maaned === ref;
      return `<i class="${erRef ? 'ref' : ''}" style="height:${Math.max(h, 2)}%"
                 title="${esc(t.maaned)}: ${nf0.format(t.sidevisninger)} sidevisninger, ${t.dage} aktive dage"></i>`;
    }).join('');
    return `<div class="spark">${bars}</div>
            <div class="spark-x"><span>${esc(trend[0].maaned)}</span><span>${esc(trend[trend.length - 1].maaned)}</span></div>`;
  };

  document.getElementById('abonnementer').innerHTML = abos.length ? abos.map(a => {
    const u = a.seneste_udfald;
    // aktive_dage_12m er rækkens EGET tal (vanebruger-vinduet, de 12 mdr FØR
    // referencen). Grafen går til og med referencen, så en sum af søjlerne
    // ville give et andet tal — vis aldrig det.
    const dele = [
      `Zone: ${esc(a.zone_label)} — ${ZONE_TEKST[a.zone] || ''}`,
      `Vægt ${nfv.format(a.vaegt)}`,
      a.aktive_dage_12m === null ? null : `${a.aktive_dage_12m} aktive dage (12 mdr.)`,
      a.vanebruger ? 'Vanebruger' : null,
      `Startet ${esc(a.foerste_maaned)}`,
      a.fornyelsesdato ? `Fornyes ${dato(a.fornyelsesdato)}` : null
    ].filter(Boolean);
    return `
      <div class="abo ${esc(a.zone)}">
        <div class="abo-top">
          <div>
            <div class="abo-site">${esc(a.site)} <span class="zpill">${esc(a.zone_label)}</span></div>
            <div class="abo-sub">${dele.map(esc).join(' · ')}</div>
          </div>
          <div style="text-align:right">
            <div class="abo-arr">${kr(a.arr_dkk)}</div>
            <div class="fine">andel af kundens ARR</div>
          </div>
        </div>
        ${sparkline(a.trend, d.meta.reference_maaned)}
        ${u ? `<div class="hist-udfald">Seneste udfald: <strong>${esc(u.outcome || u.contact_result)}</strong>
               ${u.followup_date ? ' · opfølgning ' + dato(u.followup_date) : ''}
               ${u.note ? ' · ' + esc(u.note) : ''}</div>` : ''}
      </div>`;
  }).join('') : '<div class="tom">Ingen aktive abonnementer i denne måned.</div>';

  // ARR pr. abonnement er kundens ARR delt med antal sites — et VALG, ikke en
  // måling (queries.py). Det skal stå på siden, ellers læses beløbet som prisen
  // på dét site, og et registreret udfald ville arve divisionen.
  if (abos.length > 1) {
    document.getElementById('abonnementer').insertAdjacentHTML('beforeend',
      `<p class="fine">Årsværdien pr. abonnement er kundens samlede ARR fordelt ligeligt
       på ${abos.length} sites. ACV kender ikke kronerne pr. site, så fordelingen er en
       antagelse — ikke en måling. Bekræft beløbet hos kunden, før det registreres.</p>`);
  }

  // --- historik ---
  document.getElementById('hist-sub').textContent = d.historik.length
    ? `${d.historik.length} samtale(r), nyeste først` : '';
  document.getElementById('historik').innerHTML = d.historik.length
    ? `<div class="hist">` + d.historik.map(s => `
        <div class="hist-item">
          <div class="hist-head">${dato(s.contacted_at)} · ${esc(s.channel)}</div>
          <div class="hist-meta">${esc(s.created_by)}${s.summary ? ' · ' + esc(s.summary) : ''}</div>
          <div class="hist-udfald">${s.udfald.map(u =>
            `<div>${esc(u.site)}: <strong>${esc(u.outcome || u.contact_result)}</strong>
             ${u.arr_before_dkk !== null ? ' · før ' + kr(u.arr_before_dkk) : ''}
             ${u.arr_after_dkk !== null ? ' → efter ' + kr(u.arr_after_dkk) : ''}
             ${u.arr_before_kilde === 'lige_deling' ? ' <span class="fine">(ARR er et skøn)</span>' : ''}
             ${u.followup_date ? ' · opfølgning ' + dato(u.followup_date) : ''}
             ${u.note ? '<br><span class="fine">' + esc(u.note) + '</span>' : ''}</div>`
          ).join('') || '<div class="fine">Ingen udfald registreret på samtalen.</div>'}</div>
        </div>`).join('') + `</div>`
    : '<div class="tom">Ingen samtaler registreret endnu. Registrering bygges i næste skridt (PRD §7.4).</div>';
})();
</script>
</body>
</html>
