<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Churn-risiko — Intomedia Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/hub.css">
  <link rel="icon" type="image/svg+xml" href="/static/icons/pulse.svg">
  <style>
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow-card); margin-bottom:24px; overflow:hidden; }
    .panel-header { padding:15px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-end; gap:16px; }
    .panel-header h2 { font-size:13px; font-weight:700; color:var(--ink); margin:0; }
    .panel-header p  { font-size:11px; color:var(--ink-3); margin:3px 0 0; }
    .panel-body { padding:20px; }

    /* Zone-kort. Kroner er det store tal, antal kunder det lille — omvendt af
       oplæggets søjlediagram, fordi en leder disponerer efter kroner. */
    .zones { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:24px; }
    .zcard { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--ink-4);
             border-radius:var(--r); box-shadow:var(--shadow-card); padding:14px 16px; }
    .zcard.kritisk      { border-left-color:var(--danger); }
    .zcard.opmærksomhed { border-left-color:var(--warn); }
    .zcard.sund         { border-left-color:var(--win); }
    .zcard.intet_signal { border-left-color:var(--ink-4); }
    .zcard .zlabel { font-size:11px; font-weight:600; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; }
    .zcard .zarr   { font-size:22px; font-weight:700; color:var(--ink); margin:6px 0 2px; }
    .zcard .zmeta  { font-size:11px; color:var(--ink-3); line-height:1.5; }

    /* Kortene ER filteret. Fire separate knapper med samme fire tekster lige
       nedenunder ville være dobbelt op — her står tallet og handlingen samme sted. */
    .zcard { cursor:pointer; transition:box-shadow .12s, transform .12s; text-align:left;
             font-family:inherit; width:100%; }
    .zcard:hover  { box-shadow:0 5px 18px rgba(28,28,26,.14); transform:translateY(-1px); }
    .zcard:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
    /* Valgt kort får sin EGEN zonefarve som baggrund, ikke en neutral grå. Farven
       er den samme som zonens pille i tabellen, så man kan se på farven alene
       hvilket udvalg man kigger på. ✕ i labelen er den farveblinde-sikre
       markering af at et klik mere rydder filteret. */
    .zcard.valgt  { border-color:var(--border-strong); }
    .zcard.kritisk.valgt      { background:var(--danger-light); }
    .zcard.opmærksomhed.valgt { background:var(--warn-light); }
    .zcard.sund.valgt         { background:var(--win-light); }
    .zcard.intet_signal.valgt { background:var(--taupe-light); }
    .zcard.valgt .zlabel::after { content:' ✕'; color:var(--ink-3); }
    .zcard .zhint { font-size:10px; color:var(--ink-4); margin-top:6px; }

    .pager { display:flex; align-items:center; justify-content:space-between; gap:12px;
             margin-top:14px; font-size:12px; color:var(--ink-3); flex-wrap:wrap; }
    .pager .pbtns { display:flex; gap:6px; }
    .pager button { font-family:inherit; font-size:12px; padding:5px 11px; cursor:pointer;
                    background:var(--surface); color:var(--ink-2);
                    border:1px solid var(--border-strong); border-radius:var(--r-sm); }
    .pager button:hover:not(:disabled) { background:var(--bg); color:var(--ink); }
    .pager button:disabled { opacity:.4; cursor:default; }
    .pager select { font-family:inherit; font-size:12px; padding:4px 6px;
                    border:1px solid var(--border-strong); border-radius:var(--r-sm); }

    .note { font-size:11px; border-radius:var(--r-sm); padding:10px 12px; margin-bottom:14px; line-height:1.55; }
    .note.warn   { background:var(--warn-light);   color:var(--ink-2); border:1px solid var(--border-strong); }
    .note.danger { background:var(--danger-light); color:var(--ink-2); border:1px solid var(--border-strong); }

    /* Forudsætninger og forbehold hører her: læsbare for den der spørger, uden at
       stå i vejen for tallene. En gul kasse er forbeholdt noget der er i vejen. */
    .fine { font-size:11px; color:var(--ink-3); line-height:1.6; margin:-10px 0 8px; }
    .fine strong { color:var(--ink-2); font-weight:600; }

    /* Foldet som standard: usynlig for den der bare skal ned i listen, ét klik væk
       for den der bliver spurgt "kan vi stole på det her?". Tallene stod før som
       fire gule kasser og derefter som et tæt afsnit småtryk — begge gange i vejen. */
    .daek { margin:0 0 24px; font-size:11px; color:var(--ink-3); }
    .daek > summary { cursor:pointer; color:var(--ink-2); font-weight:600;
                      padding:4px 0; user-select:none; width:max-content; }
    .daek > summary:hover { color:var(--ink); }
    .daek ul { margin:6px 0 0; padding-left:18px; line-height:1.7; }
    .daek li strong { color:var(--ink-2); font-weight:600; }

    /* Sikkerhedsnet: med fixed layout burde tabellen altid passe, men på en smal
       skærm skal den kunne scrolles frem for at blive klippet af. */
    .tbl-wrap { overflow-x:auto; }
    /* table-layout:fixed + procentbredder gør at tabellen ALDRIG bliver bredere
       end panelet. Kolonner med tekst må ombrydes; kun tal og zone-pillen holdes
       på én linje. Uden fixed layout strækker de længste kundenavne og
       team-lister tabellen ud, og så skal man scrolle vandret for at se noget. */
    table.risk { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
    table.risk th, table.risk td { padding:8px 10px; text-align:left;
                                   border-bottom:1px solid var(--border); vertical-align:top; }
    table.risk th { font-size:11px; font-weight:600; color:var(--ink-3); text-transform:uppercase; letter-spacing:.03em;
                    cursor:pointer; user-select:none; position:sticky; top:0; background:var(--surface); }
    table.risk th:hover { color:var(--ink); }
    table.risk th .arrow { color:var(--ink-4); font-size:9px; }
    table.risk th.num, table.risk td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
    /* Lange ord uden mellemrum (fx et domæne i et firmanavn) må brydes, ellers
       sprænger de deres kolonne selv med fixed layout. */
    table.risk td.txt { overflow-wrap:anywhere; }
    table.risk tbody tr:hover { background:var(--bg); }

    .pill { display:inline-block; font-size:10px; font-weight:600; padding:2px 7px; border-radius:999px; }
    .pill.kritisk      { background:var(--danger-light); color:var(--danger); }
    .pill.opmærksomhed { background:var(--warn-light);   color:var(--warn); }
    .pill.sund         { background:var(--win-light);    color:var(--win); }
    .pill.intet_signal { background:var(--taupe-light);  color:var(--ink-2); }
    .tag { display:inline-block; font-size:10px; padding:1px 6px; border-radius:var(--r-xs);
           background:var(--taupe-light); color:var(--ink-2); margin-left:6px; }

    .filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .filters label { font-size:11px; color:var(--ink-2); display:flex; align-items:center; gap:5px; cursor:pointer; }
    .filters input[type="search"] { font-family:var(--font); font-size:12px; padding:6px 10px;
                                    border:1px solid var(--border-strong); border-radius:var(--r-sm); min-width:200px; }
  </style>
</head>
<body>
<div class="shell">

  {% with active_url='/retention/risk_overview' %}{% include "_sidebar.html" %}{% endwith %}

  <div class="main">
    <div class="topbar">
      <div class="search-trigger" role="button" tabindex="0">
        <div class="st-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
        </div>
        <span class="st-text">Søg i dashboards, tools og kategorier…</span>
        <div class="st-right"><span class="st-k">⌘</span><span class="st-k">K</span></div>
      </div>
    </div>

    <div style="flex:1;min-height:0;overflow-y:auto;">
      <div style="padding:2rem;max-width:1400px;">

        <div class="breadcrumb">
          <a href="/" class="bc-link">Hub</a>
          <span class="bc-sep">/</span>
          <a href="/retention/overview" class="bc-link">Retention</a>
          <span class="bc-sep">/</span>
          <span class="bc-current">Churn-risiko</span>
        </div>

        <div class="summary-bar">
          <div>
            <h1>Churn-risiko</h1>
            <p>Aktive kunder rangeret efter hvor længe siden de sidst var aktive</p>
          </div>
        </div>

        <div id="notes"></div>
        <div class="zones" id="zones"></div>
        <p class="fine" id="zones-note"></p>
        <details class="daek" id="daekning">
          <summary>Datadækning og forbehold</summary>
          <div id="daekning-body"></div>
        </details>

        <div class="panel">
          <div class="panel-header">
            <div>
              <h2>Kunder i risiko</h2>
              <p id="tbl-sub">Indlæser…</p>
            </div>
            <div class="filters">
              <input type="search" id="q" placeholder="Søg kunde eller ejer…" autocomplete="off">
            </div>
          </div>
          <div class="panel-body">
            <div class="tbl-wrap">
              <table class="risk">
                <thead><tr id="head"></tr></thead>
                <tbody id="body"></tbody>
              </table>
            </div>
            <div class="pager" id="pager"></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
<script>
(async function () {
  const nf0  = new Intl.NumberFormat('da-DK', { maximumFractionDigits: 0 });
  const nf1  = new Intl.NumberFormat('da-DK', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

  const notes  = document.getElementById('notes');
  const zonesEl= document.getElementById('zones');
  const sub    = document.getElementById('tbl-sub');
  const head   = document.getElementById('head');
  const body   = document.getElementById('body');
  const q      = document.getElementById('q');
  const pager  = document.getElementById('pager');

  // Sidedeling. 50 rækker er nok til at overskue en arbejdsdag og lidt mere;
  // pageSize kan ændres i bunden af tabellen.
  let page = 1;
  let pageSize = 50;

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // Kroner i millioner på kortene, hele kroner i tabellen. 208.000.000 er
  // ulæseligt i en kolonne man skal skimme.
  const mio = (v) => nf1.format((v || 0) / 1e6) + ' mio. kr.';

  const fail = (msg) => {
    sub.textContent = msg;
    notes.innerHTML = '<div class="note danger">' + esc(msg) + '</div>';
  };

  // Som på overview-siden: 403 fra rolle-vagten kommer som {"detail": ...}, og
  // uden res.ok-tjekket ville koden fejle på et objekt der ikke har .rows.
  let data;
  try {
    const res = await fetch('/retention/risk');
    if (!res.ok) {
      let detail = `Kunne ikke hente data (HTTP ${res.status}).`;
      try { const b = await res.json(); if (b && b.detail) detail = b.detail; } catch (e) {}
      return fail(detail);
    }
    data = await res.json();
  } catch (e) {
    return fail('Kunne ikke hente data — netværksfejl.');
  }

  const rows = data.rows || [];
  const meta = data.meta || {};

  // ── Noter. Her stod fire gule kasser, og tilsammen signalerede de "stol ikke
  // på det her", før man havde set et eneste tal. Kun én af dem var en egentlig
  // advarsel; de tre andre var oplysninger blæst op til bannere. De er flyttet
  // derhen hvor de hører: friskhed og dækning i panel-underteksterne, tærskler
  // under zone-kortene, ejerskabs-definitionen som fodnote under tabellen.
  // En kasse vises nu KUN når der faktisk er noget i vejen.
  const n = [];
  const age = meta.usage_file_age_days;
  if (meta.usage_error) {
    n.push('<div class="note danger"><strong>Der er intet usage-signal indlæst.</strong> '
      + 'Alle kunder står derfor som “intet signal” — det betyder IKKE at ingen er i risiko. '
      + esc(meta.usage_error).replace(/\n/g, '<br>') + '</div>');
  } else if (age != null && age > 7) {
    // Over en uge BEGYNDER tallene at lyve: alle ser ældre tavse ud end de er.
    // Målt — ved 14 dages alder kan zonen "sund" slet ikke forekomme.
    n.push('<div class="note danger"><strong>Usage-data er ' + esc(age) + ' dage gammelt.</strong> '
      + 'Alle kunder ser derfor op til ' + esc(age) + ' dage mere tavse ud end de måske er, '
      + 'og zonerne skrider. Kør eksportet igen.</div>');
  }
  notes.innerHTML = n.join('');

  // ── Zone-kort, som samtidig er filteret. null = standardvisningen (de to
  // zoner der kræver handling); ellers præcis én zone. Klik på et valgt kort
  // rydder filteret igen.
  let zoneFilter = null;

  function tegnZoner() {
    zonesEl.innerHTML = (data.zone_order || []).map(z => {
      const b = (data.zones || {})[z];
      if (!b) return '';
      const extra = [];
      if (b.uden_arr)   extra.push(nf0.format(b.uden_arr) + ' uden årsværdi');
      if (b.utrackbare) extra.push(nf0.format(b.utrackbare) + ' utrackbare');
      const valgt = zoneFilter === z;
      return '<button type="button" class="zcard ' + z + (valgt ? ' valgt' : '')
        + '" data-zone="' + z + '" title="'
        + esc(valgt ? 'Klik for at rydde filteret' : 'Vis kun ' + b.label) + '">'
        + '<div class="zlabel">' + esc(b.label) + '</div>'
        + '<div class="zarr">' + mio(b.arr_dkk) + '</div>'
        + '<div class="zmeta">' + nf0.format(b.customers) + ' kunder'
        + (extra.length ? '<br>' + extra.join(' · ') : '') + '</div>'
        + (valgt ? '' : '<div class="zhint">klik for at vise</div>')
        + '</button>';
    }).join('');
  }
  tegnZoner();

  zonesEl.addEventListener('click', (e) => {
    const card = e.target.closest('.zcard');
    if (!card) return;
    zoneFilter = (zoneFilter === card.dataset.zone) ? null : card.dataset.zone;
    page = 1;              // et nyt filter skal starte forfra, ikke på side 12
    tegnZoner();
    render();
  });

  // Forudsætningerne under kortene, hvor de hører til: zonerne ER tærsklerne, og
  // datoen fortæller hvad tallene gælder. Tidligere to gule kasser.
  const th = meta.thresholds || {};
  const friskTxt = meta.usage_error ? 'intet usage-signal indlæst'
    : (meta.usage_export_date
        ? 'usage-data pr. ' + meta.usage_export_date
          + (age === 0 ? ' (i dag)' : age === 1 ? ' (i går)' : ' (' + age + ' dage siden)')
        : 'ukendt datakilde');
  // Den ene forudsætning der SKAL være synlig: uden den læses zonerne som fakta,
  // og så prioriterer nogen en arbejdsdag efter et tal fra et oplæg. "Zoner efter
  // dage siden sidste aktivitet" er skåret væk — det står nu i Zone-kolonnens
  // tooltip, hvor det ikke gentages for alle læsere hver gang.
  document.getElementById('zones-note').innerHTML =
    esc(friskTxt) + ' · '
    + (meta.thresholds_validated === false
        ? '<strong>tærsklerne ' + esc(th.attention_days) + '/' + esc(th.critical_days)
          + ' dage er oplæggets gæt</strong>, ikke målt mod faktisk churn'
        : 'tærskler ' + esc(th.attention_days) + '/' + esc(th.critical_days) + ' dage');

  // ── Tabel
  // Syv kolonner der tilsammen fylder 100%, så tabellen passer i panelet.
  // Sidst aktiv, page views, sites-listen og account er flyttet til tooltips
  // (title-attributter) frem for egne kolonner: de er nyttige når man studerer
  // én kunde, men de tvang vandret scroll for alle 2.499 rækker.
  // `hint` bliver et tooltip på overskriften. Definitioner hører her frem for i en
  // fodnote: de er der for den der spørger, og i vejen for alle andre.
  const COLS = [
    { key:'org_name',   label:'Kunde',        w:'27%', hint:'Hold musen over navnet for sites og forretningsenhed' },
    { key:'zone',       label:'Zone',         w:'13%', hint:'Efter dage siden sidste registrerede aktivitet' },
    { key:'days_since_last_activity', label:'Dage tavs',   w:'9%',  num:true,
      hint:'Dage siden kunden sidst havde aktivitet. Regnes fra dagens dato, ikke fra eksport-datoen' },
    { key:'arr_dkk',    label:'Årsværdi kr.', w:'11%', num:true,
      hint:'Annual Recurring Revenue — kundens abonnementer omregnet til kroner pr. år' },
    { key:'owner_name', label:'Ejer',         w:'16%',
      hint:'Kundens nuværende ejer i Pipedrive, ikke den der oprindeligt solgte abonnementet. Samme definition som på trendgrafen' },
    { key:'teams',      label:'Team',         w:'15%',
      hint:'Ejerens aktive team-medlemskaber. Uden et team når kunden ingen afdelingsleder' },
    { key:'active_days',label:'Aktive dage',  w:'9%',  num:true,
      hint:'Antal forskellige dage med aktivitet i de seneste 12 måneder — et bedre mål end sidevisninger, som én tung session kan puste op' },
  ];

  // Pillen viser kun zonens navn; dagsintervallet står på zone-kortene ovenfor
  // og ville gentage sig selv 2.499 gange her. Fuld tekst ligger i title.
  const zoneShort = (label) => String(label || '').replace(/\s*\(.*\)\s*$/, '');
  // "Team FINANS DK, Team Watch DK" -> "FINANS DK, Watch DK". Præfikset er ens på
  // alle teams og koster en tredjedel af kolonnens bredde.
  const teamShort = (t) => String(t || '').replace(/\bTeam\s+/g, '');

  // Zonens alvor som tal, taget fra API'ets egen raekkefoelge. Sorteres zonen som
  // tekst, bliver den alfabetisk (intet_signal, kritisk, opmærksomhed, sund) —
  // altsaa nonsens for et risikomaal.
  const ZONE_RANK = {};
  (data.zone_order || []).forEach((z, i) => { ZONE_RANK[z] = i; });

  // Standard: vaerste zone foerst, ARR som andenprioritet. En kunde der har vaeret
  // tavs i 158 dage er taettere paa at vaere tabt end en paa 20 dage, uanset
  // beloeb — og man kan altid klikke paa ARR-kolonnen for det omvendte.
  let sortKey = 'zone', sortDir = 1;

  const value = (r, k) => {
    if (k === 'zone') return ZONE_RANK[r.zone] === undefined ? 99 : ZONE_RANK[r.zone];
    const v = r[k];
    // null skal ALTID sortere nederst, uanset retning — ellers fylder kunder
    // uden data toppen af listen, og det er ikke dem man skal ringe til.
    if (v === null || v === undefined || v === '') return null;
    return v;
  };

  function visible() {
    const term = q.value.trim().toLowerCase();
    return rows.filter(r => {
      // Uden valgt zone vises de to der kræver handling. Sunde kunder og kunder
      // uden signal er ikke en arbejdsliste, men de er ét klik væk på kortene.
      if (zoneFilter === null) {
        if (r.zone !== 'kritisk' && r.zone !== 'opmærksomhed') return false;
      } else if (r.zone !== zoneFilter) {
        return false;
      }
      if (!term) return true;
      return (r.org_name || '').toLowerCase().includes(term)
          || (r.owner_name || '').toLowerCase().includes(term);
    });
  }

  function render() {
    head.innerHTML = COLS.map(c =>
      '<th data-key="' + c.key + '" style="width:' + c.w + '"'
      + (c.hint ? ' title="' + esc(c.hint) + '"' : '')
      + (c.num ? ' class="num"' : '') + '>' + esc(c.label)
      + (sortKey === c.key ? ' <span class="arrow">' + (sortDir === 1 ? '▲' : '▼') + '</span>' : '')
      + '</th>').join('');

    const list = visible().slice().sort((a, b) => {
      const va = value(a, sortKey), vb = value(b, sortKey);
      let cmp = 0;
      if (va === null && vb === null)      cmp = 0;
      else if (va === null)                cmp = 1;   // null altid nederst
      else if (vb === null)                cmp = -1;
      else if (typeof va === 'number' && typeof vb === 'number') cmp = (va - vb) * sortDir;
      else cmp = String(va).localeCompare(String(vb), 'da') * sortDir;
      if (cmp !== 0) return cmp;
      // Andenprioritet er ALTID stoerste beloeb foerst, saa den vaerste zone
      // praesenteres med de dyreste kunder oeverst. Uden dette faldt raekker med
      // samme zone tilbage paa vilkaarlig raekkefoelge.
      const aa = a.arr_dkk == null ? -1 : a.arr_dkk;
      const bb = b.arr_dkk == null ? -1 : b.arr_dkk;
      return bb - aa;
    });

    // Sidedeling. Listen er en KØ, ikke et dokument: er den sorteret efter værdi,
    // er side 1 arbejdslisten og resten findes for fuldstændighedens skyld. At
    // rendere 2.499 rækker gav to minutters scroll for at nå bunden.
    const sider = Math.max(1, Math.ceil(list.length / pageSize));
    if (page > sider) page = sider;      // filter/søgning kan have gjort listen kortere
    const fra = (page - 1) * pageSize;
    const side = list.slice(fra, fra + pageSize);

    body.innerHTML = side.map(r => {
      // Kun 'utrackbar' vises som mærke. 'delvis' sad på 696 kunder, koncentreret
      // i toppen hvor de største kunder har flest sites — et mærke på 14 af 20
      // rækker fortæller ingenting. Oplysningen ligger nu i kundens tooltip.
      const tag = r.finans_dk === 'alle' ? ' <span class="tag">utrackbar</span>' : '';
      const kundeTitel = [r.org_name, r.account,
                          r.finans_dk === 'nogle' ? 'FINANS DK indgår — signalet dækker kun en del' : '',
                          r.sites_list].filter(Boolean).join(' · ');
      const zoneFuld = (data.zones[r.zone] || {}).label || r.zone;
      return '<tr>'
        + '<td class="txt" title="' + esc(kundeTitel) + '">' + esc(r.org_name) + tag + '</td>'
        + '<td><span class="pill ' + r.zone + '" title="' + esc(zoneFuld) + '">'
          + esc(zoneShort(zoneFuld)) + '</span></td>'
        + '<td class="num" title="' + esc(r.last_activity_date ? 'Sidst aktiv ' + r.last_activity_date : 'Ingen registreret aktivitet') + '">'
          + (r.days_since_last_activity == null ? '–' : nf0.format(r.days_since_last_activity)) + '</td>'
        + '<td class="num">' + (r.arr_dkk == null ? '–' : nf0.format(r.arr_dkk)) + '</td>'
        + '<td class="txt">' + (r.owner_name ? esc(r.owner_name) : '<em>(Ikke tilskrevet)</em>') + '</td>'
        + '<td class="txt" title="' + esc(r.teams || '') + '">' + esc(teamShort(r.teams) || '–') + '</td>'
        + '<td class="num" title="' + esc(r.page_views == null ? '' : nf0.format(r.page_views) + ' sidevisninger') + '">'
          + (r.active_days == null ? '–' : nf0.format(r.active_days)) + '</td>'
        + '</tr>';
    }).join('');

    // Underteksten beskriver UDVALGET, ikke siden — ellers ser en leder "50 kunder
    // i risiko" og tror det er hele problemet.
    const arr = list.reduce((s, r) => s + (r.arr_dkk || 0), 0);
    const zoneNavn = zoneFilter
      ? zoneShort((data.zones[zoneFilter] || {}).label || zoneFilter).toLowerCase()
      : 'kritisk og opmærksomhed';
    sub.textContent = nf0.format(list.length) + ' kunder i ' + zoneNavn
      + (q.value.trim() ? ' der matcher søgningen' : '')
      + ' · ' + mio(arr) + ' i udvalget · ' + mio(meta.arr_total) + ' i alt'
      + (meta.arr_daekning
          ? ' · usage-signal dækker ' + nf1.format(meta.arr_daekning * 100) + ' % af årsværdien'
          : '');

    const til = Math.min(fra + pageSize, list.length);
    pager.innerHTML =
      '<span>' + (list.length ? 'Viser ' + nf0.format(fra + 1) + '–' + nf0.format(til)
                                + ' af ' + nf0.format(list.length) : 'Ingen kunder i udvalget')
      + (sider > 1 ? ' · side ' + page + ' af ' + nf0.format(sider) : '') + '</span>'
      + '<span class="pbtns">'
      + '<label style="margin-right:8px;">Pr. side '
      + '<select id="psize">'
      + [25, 50, 100, 250].map(n =>
          '<option value="' + n + '"' + (n === pageSize ? ' selected' : '') + '>' + n + '</option>').join('')
      + '</select></label>'
      + '<button id="pfirst"' + (page === 1 ? ' disabled' : '') + '>« Første</button>'
      + '<button id="pprev"'  + (page === 1 ? ' disabled' : '') + '>‹ Forrige</button>'
      + '<button id="pnext"'  + (page >= sider ? ' disabled' : '') + '>Næste ›</button>'
      + '<button id="plast"'  + (page >= sider ? ' disabled' : '') + '>Sidste »</button>'
      + '</span>';

    const gaaTil = (n) => { page = Math.min(Math.max(1, n), sider); render(); scrollTilTop(); };
    document.getElementById('pfirst').onclick = () => gaaTil(1);
    document.getElementById('pprev').onclick  = () => gaaTil(page - 1);
    document.getElementById('pnext').onclick  = () => gaaTil(page + 1);
    document.getElementById('plast').onclick  = () => gaaTil(sider);
    document.getElementById('psize').onchange = (e) => {
      pageSize = parseInt(e.target.value, 10);
      page = 1;
      render();
    };
  }

  // Ved sideskift skal man se toppen af tabellen, ikke stå midt i den nye side.
  function scrollTilTop() {
    const p = document.querySelector('.panel-header');
    if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Forbeholdene: foldet sammen, ikke fjernet. De var først fire gule kasser, så
  // ét tæt afsnit småtryk — begge gange i vejen for tallene. Nu er de ét klik væk
  // for den der bliver spurgt "kan vi stole på det her?", og usynlige for den der
  // bare skal ned i listen. Kolonne-definitioner ligger som tooltips.
  const ms = meta.mangler_signal || {};
  const punkter = [];
  if (meta.arr_daekning) {
    punkter.push('<strong>Usage-signal for ' + nf0.format(meta.med_signal) + ' af '
      + nf0.format(meta.customers) + ' kunder — ' + nf1.format(meta.arr_daekning * 100)
      + ' % af årsværdien.</strong> De manglende er overvejende små kunder.');
  }
  if (ms.helt_tavs && ms.helt_tavs.customers) {
    punkter.push(nf0.format(ms.helt_tavs.customers) + ' kunder (' + mio(ms.helt_tavs.arr_dkk)
      + ') har haft <strong>nul aktivitet i over 12 måneder</strong> og falder derfor ud af '
      + 'usage-eksportet. Det er ikke manglende data, men den kraftigste advarsel i '
      + 'datasættet — de bør flyttes op i zonerne.');
  }
  if (ms.utrackbar && ms.utrackbar.customers) {
    punkter.push(nf0.format(ms.utrackbar.customers) + ' kunder (' + mio(ms.utrackbar.arr_dkk)
      + ') abonnerer kun på FINANS DK, som aldrig sætter et spor i Snowplow. De kan '
      + 'ikke få et signal, uanset hvor aktive de er.');
  }
  if (ms.ingen_zuora && ms.ingen_zuora.customers) {
    punkter.push(nf0.format(ms.ingen_zuora.customers) + ' kunder (' + mio(ms.ingen_zuora.arr_dkk)
      + ' i alt) har ingen Zuora-konto at oversætte fra — mikrokunder à godt 700 kr.');
  }
  if (meta.delvist_trackbare) {
    punkter.push(nf0.format(meta.delvist_trackbare) + ' kunder har FINANS DK blandt flere sites, '
      + 'så signalet dækker kun en del af deres abonnementer.');
  }
  if (meta.uden_arr)  punkter.push(nf0.format(meta.uden_arr) + ' kunder har ingen årsværdi og indgår ikke i kronesummerne.');
  if (meta.uden_ejer) punkter.push(nf0.format(meta.uden_ejer) + ' kunder har ingen tilskrevet ejer og ses kun i den firmabrede visning.');
  if (meta.uden_team) punkter.push(nf0.format(meta.uden_team) + ' kunder har en ejer uden aktivt team-medlemskab og når derfor ingen afdelingsleder.');

  document.getElementById('daekning-body').innerHTML =
    '<ul><li>' + punkter.join('</li><li>') + '</li></ul>';

  head.addEventListener('click', (e) => {
    const th = e.target.closest('th');
    if (!th) return;
    const key = th.dataset.key;
    // Nyt felt: start faldende for tal (størst først er det interessante) og
    // stigende for tekst. Zonen starter stigende, fordi rang 0 er den værste.
    // Samme felt igen: vend retningen.
    if (key === sortKey) sortDir = -sortDir;
    else if (key === 'zone') { sortKey = key; sortDir = 1; }
    else { sortKey = key; sortDir = (COLS.find(c => c.key === key) || {}).num ? -1 : 1; }
    // Ny sortering ændrer hvem der ligger på side 1, så vi hopper tilbage dertil.
    // Ellers ser man side 12 af en helt ny rækkefølge, hvilket ingen kan gennemskue.
    page = 1;
    render();
  });
  // Ny søgning starter på side 1 — ellers står man på en tom side 12.
  q.addEventListener('input', () => { page = 1; render(); });

  render();
})();
</script>
</body>
</html>
